<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Analytics APIs</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .success { color: green; }
        .error { color: red; }
        .loading { color: blue; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 3px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Test de APIs de Analíticas</h1>
    
    <div class="test-section">
        <h2>Estado de Autenticación</h2>
        <div id="auth-status">Verificando...</div>
        <button onclick="checkAuth()">Verificar Autenticación</button>
    </div>

    <div class="test-section">
        <h2>Test de APIs</h2>
        <button onclick="testContentAPI()">Test Content API</button>
        <button onclick="testOrdersAPI()">Test Orders API</button>
        <button onclick="testAthleteStatsAPI()">Test Athlete Stats API</button>
        <button onclick="testDataAPI()">Test Data API (No Auth)</button>
        <button onclick="testAuthAPI()">Test Auth API</button>
        <div id="api-results"></div>
    </div>

    <script>
        async function checkAuth() {
            const statusDiv = document.getElementById('auth-status');
            statusDiv.innerHTML = '<span class="loading">Verificando...</span>';
            
            try {
                const response = await fetch('/api/health');
                const data = await response.json();
                statusDiv.innerHTML = `<span class="success">Servidor funcionando: ${data.status}</span>`;
            } catch (error) {
                statusDiv.innerHTML = `<span class="error">Error: ${error.message}</span>`;
            }
        }

        async function testContentAPI() {
            const resultsDiv = document.getElementById('api-results');
            resultsDiv.innerHTML = '<div class="loading">Probando Content API...</div>';
            
            try {
                const response = await fetch('/api/analytics/content?group_by=global', {
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                const data = await response.json();
                
                if (data.success) {
                    resultsDiv.innerHTML = `
                        <div class="success">✅ Content API funcionando</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    resultsDiv.innerHTML = `
                        <div class="error">❌ Content API error: ${data.error}</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">❌ Error de red: ${error.message}</div>`;
            }
        }

        async function testOrdersAPI() {
            const resultsDiv = document.getElementById('api-results');
            resultsDiv.innerHTML = '<div class="loading">Probando Orders API...</div>';
            
            try {
                const response = await fetch('/api/analytics/orders?group_by=global', {

                if (data.success) {
                    resultsDiv.innerHTML = `
                        <div class="success">✅ Orders API funcionando</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    resultsDiv.innerHTML = `
                        <div class="error">❌ Orders API error: ${data.error}</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">❌ Error de red: ${error.message}</div>`;
            }
        }

        async function testAthleteStatsAPI() {
            const resultsDiv = document.getElementById('api-results');
            resultsDiv.innerHTML = '<div class="loading">Probando Athlete Stats API...</div>';
            
            try {
                const response = await fetch('/api/analytics/athlete-stats', {
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                const data = await response.json();
                
                if (data.success) {
                    resultsDiv.innerHTML = `
                        <div class="success">✅ Athlete Stats API funcionando</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    resultsDiv.innerHTML = `
                        <div class="error">❌ Athlete Stats API error: ${data.error}</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">❌ Error de red: ${error.message}</div>`;
            }
        }

        async function testDataAPI() {
            const resultsDiv = document.getElementById('api-results');
            resultsDiv.innerHTML = '<div class="loading">Probando Data API...</div>';
            
            try {
                const response = await fetch('/api/test-analytics');
                const data = await response.json();
                
                if (data.success) {
                    resultsDiv.innerHTML = `
                        <div class="success">✅ Data API funcionando</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    resultsDiv.innerHTML = `
                        <div class="error">❌ Data API error: ${data.error}</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">❌ Error de red: ${error.message}</div>`;
            }
        }

        async function testAuthAPI() {
            const resultsDiv = document.getElementById('api-results');
            resultsDiv.innerHTML = '<div class="loading">Probando Auth API...</div>';
            
            try {
                const response = await fetch('/api/test-auth', {
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                const data = await response.json();
                
                if (data.success) {
                    resultsDiv.innerHTML = `
                        <div class="success">✅ Auth API funcionando</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    resultsDiv.innerHTML = `
                        <div class="error">❌ Auth API error: ${data.error}</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">❌ Error de red: ${error.message}</div>`;
            }
        }

        // Verificar autenticación al cargar la página
        window.onload = checkAuth;
    </script>
</body>
</html>
