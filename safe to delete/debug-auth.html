<!DOCTYPE html>
<html>
<head>
    <title>Debug Auth</title>
</head>
<body>
    <h1>Debug Authentication</h1>
    <div id="debug-info"></div>
    
    <script>
        async function debugAuth() {
            const debugDiv = document.getElementById('debug-info');
            
            try {
                // Test basic API
                const response = await fetch('/api/equipment/categories');
                const data = await response.json();
                
                debugDiv.innerHTML = `
                    <h2>API Test</h2>
                    <p>Equipment API Status: ${response.status}</p>
                    <p>Categories: ${JSON.stringify(data)}</p>
                    
                    <h2>Analytics API Test</h2>
                `;
                
                // Test analytics API
                const analyticsResponse = await fetch('/api/analytics/content-simple?group_by=global');
                const analyticsData = await analyticsResponse.json();
                
                debugDiv.innerHTML += `
                    <p>Analytics API Status: ${analyticsResponse.status}</p>
                    <p>Content Stats: ${JSON.stringify(analyticsData)}</p>
                `;
                
            } catch (error) {
                debugDiv.innerHTML = `<p>Error: ${error.message}</p>`;
            }
        }
        
        debugAuth();
    </script>
</body>
</html>
